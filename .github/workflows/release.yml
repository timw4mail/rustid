name: Release Binaries
on:
  push:
    tags:
      - "v*"
jobs:
  generate:
    name: Create release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update

      - name: Install just
        run: |
          curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install DOSBox-X
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x

      - name: Clean build environment
        run: cargo clean && just clean

      - name: Build dos
        run: just build-dos

      - name: Package DOS binaries
        run: |
          zip rustid-dos.zip rustid.exe rust86.exe debug86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustid-dos
          path: rustid-dos.zip

      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create --generate-notes ${{ github.ref }} './rustid-dos.zip#DOS Binaries (rustid-dos.zip)'
