name: Release Binaries
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  generate:
    name: Create release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update

      - name: Install just
        run: |
          curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install DOSBox-X
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x

      - name: Clean build environment
        run: cargo clean && just clean

      - name: Build DOS binaries
        run: just build-dos

      - name: Package DOS binaries
        run: |
          zip rustid-dos.zip rustid.exe rust86.exe

      - name: Build EFI binaries
        run: just build-efi

      - name: Package EFI binaries
        run: |
          (cd target/efi-disk && zip -r ../../rustid-efi.zip EFI)

      - name: Build Windows GUI binaries
        run: |
          just build-windows-gui
          zip -j rustid-windows.zip target/dist/rustid_x86_32.exe target/dist/rustid_x86_64.exe target/dist/rustid_arm64.exe

      - name: Upload DOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustid-dos
          path: rustid-dos.zip

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustid-efi
          path: rustid-efi.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: rustid-windows
          path: rustid-windows.zip

      - name: Extract changelog entry
        id: changelog
        run: |
          python3 .github/scripts/extract_changelog.py "${{ github.ref_name }}" --output-notes release_notes.md --output-title release_title.txt --github-output

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE=$(cat release_title.txt)
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file release_notes.md
            gh release upload "$TAG" './rustid-dos.zip#DOS Binaries (rustid-dos.zip)' './rustid-efi.zip#EFI Binaries (rustid-efi.zip)' './rustid-windows.zip#Windows Binaries (rustid-windows.zip)' --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" './rustid-dos.zip#DOS Binaries (rustid-dos.zip)' './rustid-efi.zip#EFI Binaries (rustid-efi.zip)' './rustid-windows.zip#Windows Binaries (rustid-windows.zip)' --title "$RELEASE_TITLE" --notes-file release_notes.md
          fi
          rm -f release_notes.md release_title.txt

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN or CRATES_IO_TOKEN secret is not set in repository secrets."
            exit 1
          fi
          cargo publish
