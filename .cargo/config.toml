[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target."i486-linux-musl.json"]
rustflags = [
	"-C", "target-cpu=i486",
]

[target.i486-dos]
linker = "rust-lld"
rustflags = [
	"-C", "codegen-units=1",
	"-C", "link-arg=-Tbuild-config/link.x",
	"-C", "link-arg=--gc-sections",
	"-C", "panic=abort",
	"-C", "target-cpu=i486",
	"-C", "lto=y",
	"-C", "linker-plugin-lto=y",
	"-C", "strip=symbols"
]

[target.i586-unknown-linux-gnu]
rustflags = [
	"-C", "target-cpu=i486",
]

[target.i686-unknown-uefi]
rustflags = [
	"-C", "link-arg=/SUBSYSTEM:EFI_APPLICATION,1.10",
	"-C", "link-arg=/BASE:0",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
	"-C", "target-cpu=x86-64",
]

[target.x86_64-unknown-uefi]
rustflags = [
	"-C", "target-cpu=x86-64",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
	"-C", "target-cpu=x86-64",
]

[target.i686-pc-windows-gnu]
rustflags = [
	"-C", "target-cpu=i486",
	"-C", "target-feature=-sse,-sse2",
]

[target.aarch64-pc-windows-gnullvm]
rustflags = [
	"-C", "target-feature=+crt-static",
]
