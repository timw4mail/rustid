[package]
name = "rustid"
version = "2.1.0"
edition = "2024"
authors = ["Timothy J. Warren <tim@timshome.page>"]
description = "A utility to identify the name and properties of the current cpu"
repository = "https://git.timshomepage.net/timw4mail/rustid.git"
license = "MIT"
default-run = "rustid"

[dependencies]


[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "none", target_os = "uefi", target_arch = "arm")))'.dependencies]
core_affinity = "0.8.3"

[[bin]]
name = "rustid"
path="src/rustid.rs"

[[bin]]
name = "rust86"
required-features = ["dos-build"]
path= "src/rust86.rs"

[[bin]]
name = "dos_rustid"
required-features = ["dos32a-build"]
path= "src/dos_rustid.rs"

[[bin]]
name = "efi_rustid"
required-features = ["efi-build"]
path = "src/efi_rustid.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(dos)', 'cfg(dos32a)', 'cfg(uefi)', 'cfg(nostd_os)'] }

[lints.clippy]
unwrap_used = "warn"

[features]
default = []
debug = []
dos-build = []
dos32a-build = []
efi-build = []
