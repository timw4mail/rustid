[package]
name = "rustid"
version = "2.1.1"
edition = "2024"
authors = ["Timothy J. Warren <tim@timshome.page>"]
description = "A utility to identify the name and properties of the current cpu"
repository = "https://git.timshomepage.net/timw4mail/rustid.git"
license = "MIT"
default-run = "rustid"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSAttributedString", "NSDictionary", "NSString", "NSURL", "NSValue", "NSGeometry", "NSRange", "NSProcessInfo", "NSNotification", "NSObject", "NSData", "NSBundle", "NSFileManager", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSWindow", "NSView", "NSTextView", "NSText", "NSScrollView",
    "NSMenu", "NSMenuItem", "NSAppearance", "NSFont", "NSAlert", "NSPasteboard",
    "NSOpenPanel", "NSSavePanel", "NSColor", "NSImage", "NSResponder", "NSWorkspace",
    "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSAttributedString",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[target.'cfg(not(any(target_os = "none", target_os = "uefi", target_arch = "arm")))'.dependencies]
core_affinity = "0.8.3"

[[bin]]
name = "rustid"
path="src/rustid.rs"

[[bin]]
name = "rustid-gui"
required-features = ["gui"]
path = "src/rustid_gui.rs"

[[bin]]
name = "dos_rustid"
path = "src/dos_rustid.rs"

[[bin]]
name = "efi_rustid"
required-features = ["efi-build"]
path = "src/efi_rustid.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(dos)', 'cfg(dos32a)', 'cfg(uefi)', 'cfg(nostd_os)', 'cfg(macos_os)'] }

[lints.clippy]
unwrap_used = "warn"

[features]
default = []
debug = []
dos-build = []
dos32a-build = []
efi-build = []
gui = []
