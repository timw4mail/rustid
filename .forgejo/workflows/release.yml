name: Release Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  generate:
    name: Create release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            rustup update
          fi
          rustup toolchain install nightly --profile minimal --component rust-src || true

      - name: Install just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin || cargo install just --locked
          fi

      - name: Install system dependencies
        run: |
          APT_CMD="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            APT_CMD="sudo apt-get"
          fi
          $APT_CMD update
          $APT_CMD install -y dosbox-x gcc-mingw-w64-i686 mingw-w64-i686-dev libgtk-3-dev zip python3

      - name: Clean build environment
        run: cargo clean && just clean

      - name: Build DOS binaries
        run: just build-dos

      - name: Package DOS binaries
        run: |
          zip -j rustid-dos.zip target/dist/dos/rustid.exe target/dist/dos/rust86.exe

      - name: Build EFI binaries
        run: just build-efi

      - name: Package EFI binaries
        run: |
          (cd target/dist/efi && zip -r ../../../rustid-efi.zip EFI)

      - name: Build Windows GUI binaries
        run: |
          just build-windows-gui
          zip -j rustid-windows.zip target/dist/windows/rustid_x86_32.exe target/dist/windows/rustid_x86_64.exe target/dist/windows/rustid_arm64.exe

      - name: Build Linux AppImage
        run: |
          just build-appimage

      - name: Upload DOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustid-dos
          path: rustid-dos.zip

      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustid-efi
          path: rustid-efi.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustid-windows
          path: rustid-windows.zip

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustid-appimage
          path: target/dist/linux/rustid-*.AppImage

      - name: Extract changelog entry
        id: changelog
        run: |
          python3 .github/scripts/extract_changelog.py "${{ github.ref_name }}" --output-notes release_notes.md --output-title release_title.txt --github-output

      - name: Publish Forgejo Release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TAG: ${{ github.ref_name }}
        run: |
          python3 .forgejo/scripts/publish_release.py \
            --title-file release_title.txt \
            --notes-file release_notes.md \
            --assets \
              rustid-dos.zip \
              rustid-efi.zip \
              rustid-windows.zip \
              "target/dist/linux/rustid-*.AppImage"
          rm -f release_notes.md release_title.txt

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN or CRATES_IO_TOKEN secret is not set in repository secrets; skipping crates.io publish."
          else
            cargo publish
          fi
