name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: rust-latest

    steps:
      - name: Checkout repository
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y git
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y git
            fi
          fi
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: token ${{ github.token }}" fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install nightly --profile minimal --component rust-src || true

      - name: Install just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin || cargo install just --locked
          fi

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_CMD=""
          if command -v sudo >/dev/null 2>&1; then
            APT_CMD="sudo apt-get"
          elif command -v apt-get >/dev/null 2>&1; then
            APT_CMD="apt-get"
          fi
          if [ -n "$APT_CMD" ]; then
            $APT_CMD update && $APT_CMD install -y dosbox-x gcc-mingw-w64-i686 mingw-w64-i686-dev libgtk-3-dev docker.io || true
          fi

      - name: Setup Docker
        run: |
          if ! docker info >/dev/null 2>&1; then
            if [ -S /var/run/docker.sock ]; then
              chmod 666 /var/run/docker.sock 2>/dev/null || true
            fi
            if ! docker info >/dev/null 2>&1; then
              if command -v service >/dev/null 2>&1; then
                service docker start 2>/dev/null || true
              elif command -v dockerd >/dev/null 2>&1; then
                dockerd >/tmp/dockerd.log 2>&1 &
              fi
              for i in $(seq 1 10); do
                if docker info >/dev/null 2>&1; then break; fi
                sleep 1
              done
            fi
          fi
          docker --version || true

      - name: Compile checks
        run: just check-ci

      - name: Run tests
        run: just test-all

      - name: Build DOS binaries
        run: just build-dos

      - name: Build EFI binaries
        run: just build-efi

      - name: Build Linux AppImage
        run: just build-appimage
