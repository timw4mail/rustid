name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            rustup update
          fi
          rustup toolchain install nightly --profile minimal --component rust-src || true

      - name: Install just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin || cargo install just --locked
          fi

      - name: Install system dependencies
        run: |
          APT_CMD="apt-get"
          if command -v sudo >/dev/null 2>&1; then
            APT_CMD="sudo apt-get"
          fi
          $APT_CMD update
          $APT_CMD install -y dosbox-x gcc-mingw-w64-i686 mingw-w64-i686-dev libgtk-3-dev

      - name: Compile checks
        run: just check-ci

      - name: Run tests
        run: just test-all

      - name: Build DOS binaries
        run: just build-dos

      - name: Build EFI binaries
        run: just build-efi

      - name: Build Linux AppImage
        run: just build-appimage
