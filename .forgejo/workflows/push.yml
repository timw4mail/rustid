name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: rust-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        run: |
          if ! command -v just >/dev/null 2>&1; then
            curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin || cargo install just --locked
          fi

      - name: Install DOSBox-X
        run: |
          if ! command -v dosbox-x >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y dosbox-x || true
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y dosbox-x || true
            fi
          fi

      - name: Setup nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src || true

      - name: Compile checks
        run: just check-ci

      - name: Run tests
        run: just test-all

      - name: Build DOS binaries
        run: just build-dos

      - name: Build EFI binaries
        run: just build-efi

      - name: Build Linux AppImage
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y libgtk-3-dev || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y libgtk-3-dev || true
          fi
          just build-appimage
